{% extends 'delivery/base.html' %}
{% block title %}Sign Up — Meal Buddy{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-9">

            <div class="text-center mb-4">
                <div style="font-size:2.5rem;">🍽️</div>
                <h3 class="fw-bold mt-2" style="color:#1a1a2e;">Create your account</h3>
                <p class="text-muted" style="font-size:0.9rem;">Join Meal Buddy and start ordering today.</p>
            </div>

            <div class="card">
                <div class="card-body p-4 p-lg-5">
                    <form action="{% url 'signup' %}" method="post">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label class="form-label">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0" style="border-radius:10px 0 0 10px;">
                                        <i class="bi bi-person text-muted"></i>
                                    </span>
                                    <input type="text" name="username" class="form-control border-start-0"
                                           placeholder="Choose a username" required
                                           style="border-radius:0 10px 10px 0;">
                                </div>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0" style="border-radius:10px 0 0 10px;">
                                        <i class="bi bi-lock text-muted"></i>
                                    </span>
                                    <input type="password" name="password" class="form-control border-start-0"
                                           placeholder="Create a password" required
                                           style="border-radius:0 10px 10px 0;">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0" style="border-radius:10px 0 0 10px;">
                                    <i class="bi bi-envelope text-muted"></i>
                                </span>
                                <input type="email" name="email" class="form-control border-start-0"
                                       placeholder="you@example.com" required
                                       style="border-radius:0 10px 10px 0;">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0" style="border-radius:10px 0 0 10px;">
                                    <i class="bi bi-phone text-muted"></i>
                                </span>
                                <input type="text" name="mobile" class="form-control border-start-0"
                                       placeholder="10-digit mobile number" maxlength="10"
                                       style="border-radius:0 10px 10px 0;">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Delivery Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 align-items-start pt-2"
                                      style="border-radius:10px 0 0 10px;">
                                    <i class="bi bi-geo-alt text-muted"></i>
                                </span>
                                <textarea name="address" class="form-control border-start-0" rows="3"
                                          placeholder="Enter your full delivery address"
                                          style="border-radius:0 10px 10px 0;"></textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2" style="border-radius:10px; font-size:1rem;">
                            <i class="bi bi-person-check-fill me-2"></i>Create Account
                        </button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center text-muted mb-0" style="font-size:0.9rem;">
                        Already have an account?
                        <a href="open_signin" style="color: #FF6B35; font-weight:600;">Sign In</a>
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
