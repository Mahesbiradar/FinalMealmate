<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meal Buddy{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary:      #FF6B35;
            --primary-dark: #e55a24;
            --primary-light:#fff0eb;
            --dark:         #1a1a2e;
            --dark2:        #16213e;
            --card-shadow:  0 4px 24px rgba(0,0,0,0.09);
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f0eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main { flex: 1; }

        /* ── Navbar ── */
        .navbar {
            background: var(--dark) !important;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
            padding: 0.75rem 0;
        }
        .navbar-brand {
            color: var(--primary) !important;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }
        .navbar-brand i { margin-right: 6px; }
        .navbar-text { color: #ccc; font-size: 0.9rem; }

        /* ── Buttons ── */
        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .btn-primary:hover, .btn-primary:focus {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .btn-outline-primary {
            color: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
        }
        .btn-outline-primary:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .btn-dark { background: var(--dark); border-color: var(--dark); }
        .btn-dark:hover { background: var(--dark2); border-color: var(--dark2); }

        /* ── Cards ── */
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }
        .card-header-accent {
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%);
            color: white;
            padding: 1.25rem 1.5rem;
        }
        .card-header-accent h5 { margin: 0; font-weight: 700; }

        /* ── Forms ── */
        .form-control, .form-select {
            border-radius: 10px;
            border: 1.5px solid #ddd;
            padding: 0.65rem 1rem;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255,107,53,0.18);
        }
        .form-label { font-weight: 600; font-size: 0.88rem; color: #444; margin-bottom: 4px; }
        .form-floating label { color: #888; }

        /* ── Tables ── */
        .table-styled thead {
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%);
            color: white;
        }
        .table-styled thead th { font-weight: 600; font-size: 0.88rem; letter-spacing: 0.4px; padding: 1rem; border: none; }
        .table-styled tbody tr { vertical-align: middle; }
        .table-styled tbody td { padding: 0.85rem 1rem; border-color: #eee; font-size: 0.93rem; }
        .table-styled tbody tr:hover { background: #fff8f5; }

        /* ── Badges ── */
        .badge-veg   { background: #28a745; color: #fff; font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
        .badge-nonveg{ background: #dc3545; color: #fff; font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
        .badge-rating{ background: var(--primary); color: #fff; font-size: 0.8rem; padding: 3px 10px; border-radius: 20px; font-weight: 600; }

        /* ── Page header strip ── */
        .page-header {
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%);
            color: white;
            padding: 1.75rem 0 1.5rem;
            margin-bottom: 2rem;
        }
        .page-header h2 { font-weight: 700; margin: 0; }
        .page-header p  { margin: 0.25rem 0 0; opacity: 0.7; font-size: 0.92rem; }

        /* ── Food item card ── */
        .food-card { transition: transform 0.2s, box-shadow 0.2s; }
        .food-card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(0,0,0,0.13); }
        .food-card .food-img {
            width: 100%; height: 180px;
            object-fit: cover;
        }

        /* ── Restaurant card ── */
        .resto-card { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .resto-card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(0,0,0,0.13); }
        .resto-card .resto-img {
            width: 100%; height: 200px;
            object-fit: cover;
        }

        /* ── Footer ── */
        footer {
            background: var(--dark);
            color: #999;
            padding: 1.25rem 0;
            font-size: 0.85rem;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-egg-fried"></i>Meal Buddy
            </a>
            {% block navbar_extra %}{% endblock %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container text-center">
            <i class="bi bi-egg-fried me-1" style="color:var(--primary)"></i>
            &copy; 2025 Meal Buddy &mdash; Delicious food, delivered fast.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
