{% extends 'delivery/base.html' %}
{% block title %}Sign In — Meal Buddy{% endblock %}

{% block content %}
<div class="container py-5" style="min-height: calc(100vh - 130px); display:flex; align-items:center;">
    <div class="row w-100 justify-content-center">

        <!-- Left illustration panel (hidden on mobile) -->
        <div class="col-lg-5 d-none d-lg-flex align-items-center justify-content-center"
             style="background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 16px 0 0 16px; padding: 3rem;">
            <div class="text-center text-white">
                <div style="font-size: 5rem;">🍕</div>
                <h3 class="mt-3 fw-bold">Hungry?</h3>
                <p style="opacity:0.7; font-size:0.95rem;">Sign in to explore restaurants and order your favourite meals.</p>
            </div>
        </div>

        <!-- Form panel -->
        <div class="col-lg-5 col-md-8">
            <div class="card h-100" style="border-radius: 0 16px 16px 0;">
                <div class="card-body p-5">
                    <h4 class="fw-bold mb-1" style="color: #1a1a2e;">Welcome back!</h4>
                    <p class="text-muted mb-4" style="font-size:0.9rem;">Enter your credentials to continue.</p>

                    <form action="{% url 'signin' %}" method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0" style="border-radius:10px 0 0 10px;">
                                    <i class="bi bi-person text-muted"></i>
                                </span>
                                <input type="text" name="username" class="form-control border-start-0"
                                       placeholder="Enter your username" required
                                       style="border-radius:0 10px 10px 0;">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0" style="border-radius:10px 0 0 10px;">
                                    <i class="bi bi-lock text-muted"></i>
                                </span>
                                <input type="password" name="password" class="form-control border-start-0"
                                       placeholder="Enter your password" required
                                       style="border-radius:0 10px 10px 0;">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2" style="border-radius:10px; font-size:1rem;">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center text-muted mb-0" style="font-size:0.9rem;">
                        Don't have an account?
                        <a href="open_signup" style="color: #FF6B35; font-weight:600;">Sign Up</a>
                    </p>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
